[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ta-sru"
version = "0.1.0"
description = "基于 Isaac Sim/Isaac Lab、无需 SB3 的非对称循环 PPO 无人机导航示例"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imageio-ffmpeg>=0.4.9",
    "numpy>=1.21",
    "Pillow>=8",
    "scikit-fmm>=2025.1",
    "tensorboard>=2.10",
    "torch>=2.0",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ta_sru.debug" = ["*.html"]
